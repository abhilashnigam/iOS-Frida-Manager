<style>
  :root{ color-scheme: light dark;
    --bg:#0b0d10; --fg:#eef0f3; --muted:#99a0aa; --card:#161a21; --border:#272d37; --accent:#3b82f6; }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --fg:#14171c; --muted:#656c76; --card:#ffffff; --border:#e5e8ec; } }
  *{ box-sizing:border-box; }
  body{ font:16px/1.55 -apple-system,system-ui,sans-serif; max-width:600px; margin:0 auto;
    padding:2.2rem 1.15rem; color:var(--fg); background:var(--bg); -webkit-text-size-adjust:100%; }
  header{ display:flex; align-items:center; gap:.9rem; margin-bottom:.3rem; }
  .app-icon{ width:62px; height:62px; border-radius:15px; box-shadow:0 3px 12px rgba(0,0,0,.28); flex:none; }
  h1{ font-size:1.55rem; margin:0; letter-spacing:-.01em; }
  .sub{ color:var(--muted); margin:.9rem 0 0; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin:1.4rem 0 1.6rem; }
  .card{ display:flex; align-items:center; gap:.7rem; padding:.8rem .9rem; border-radius:14px;
    background:var(--card); border:1px solid var(--border); text-decoration:none; color:var(--fg);
    font-weight:600; transition:transform .08s ease, border-color .15s ease; }
  .card:hover{ border-color:var(--accent); }
  .card:active{ transform:scale(.97); }
  .card svg{ width:38px; height:38px; flex:none; }
  .manual{ color:var(--muted); font-size:.93rem; margin:0 0 .55rem; }
  .url-row{ display:flex; gap:.5rem; }
  #src{ flex:1; min-width:0; background:var(--card); border:1px solid var(--border); padding:.7rem .8rem;
    border-radius:11px; font-family:ui-monospace,Menlo,monospace; font-size:.85rem; word-break:break-all; color:var(--fg); }
  #copy{ border:1px solid var(--border); background:var(--card); color:var(--fg); border-radius:11px;
    padding:0 1rem; font-weight:600; font-size:.9rem; cursor:pointer; flex:none; }
  #copy:active{ transform:scale(.96); }
  footer{ color:var(--muted); font-size:.9rem; margin-top:1.7rem; }
  a{ color:var(--accent); }
</style>
